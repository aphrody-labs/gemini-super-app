<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self';"><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../assets/overlay_tokens.css"><style>:root{color-scheme:light dark;--bg-bar:var(--setting-card-bg,#f8f9fa);--border-bottom:var(--card-border,#dadce0);--text-color:var(--text-primary,#1f1f1f);--btn-hover-bg:var(--hover-bg,rgba(31,31,31,0.08));--btn-active-bg:var(--active-bg,rgba(31,31,31,0.12))}html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font-family)}body{display:flex;align-items:center;background:var(--bg-bar);border-bottom:1px solid var(--border-bottom);user-select:none}#back{display:inline-flex;align-items:center;gap:8px;margin-inline-start:12px;padding-block:6px;padding-inline:10px 14px;border:none;border-radius:18px;background:transparent;color:var(--text-color);font-size:13px;font-weight:500;cursor:pointer;transition:background 0.15s ease,color 0.15s ease}#back:hover{background:var(--btn-hover-bg)}#back:active{background:var(--btn-active-bg)}#arrow{font-size:16px;line-height:1}[dir='rtl'] #arrow{transform:scaleX(-1)}</style></head><body><button id="back" type="button"> <span id="arrow" aria-hidden="true">&#8592;</span> <span id="label">Back</span> </button></body></html>
