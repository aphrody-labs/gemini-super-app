<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';"
    />
    <title>Gemini</title>
    <link rel="stylesheet" href="../assets/fonts/fonts.css" />
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: var(--font-family);
        background: radial-gradient(
          1200px 600px at 50% -10%,
          #e8f0fe 0%,
          #ffffff 60%
        );
        color: #1f1f1f;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: radial-gradient(
            1200px 600px at 50% -10%,
            #1a2233 0%,
            #0b0f19 60%
          );
          color: #e3e3e3;
        }
      }
      .spark {
        width: 72px;
        height: 72px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
      .label {
        margin-top: 22px;
        font-size: 16px;
        letter-spacing: 0.2px;
        opacity: 0.85;
      }
      .dots::after {
        content: "";
        animation: dots 1.5s steps(4, end) infinite;
      }
      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
    </style>
  </head>
  <body>
    <img class="spark" src="../assets/icon.png" alt="" aria-hidden="true" />
    <div class="label">
      <span id="loading-label">Loading Gemini</span><span class="dots"></span>
    </div>
  </body>
</html>
