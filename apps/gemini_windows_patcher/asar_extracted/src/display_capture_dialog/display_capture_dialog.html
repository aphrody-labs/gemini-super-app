<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Screen Capture</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"><link rel="stylesheet" href="../../assets/overlay_tokens.css"><style>*{box-sizing:border-box;margin:0;padding:0;user-select:none}html,body{width:100%;height:100%;overflow:hidden;font-family:var(--font-family);background:transparent}body{display:flex;justify-content:center;align-items:center;padding:var(--overlay-gutter-xl)}.dialog-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px;box-shadow:var(--shadow-elevation-3);width:480px;padding-block:22px;padding-inline:24px;display:flex;flex-direction:column;gap:12px;animation:m3FadeIn 0.18s cubic-bezier(0.05,0.7,0.1,1.0)}@keyframes m3FadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}.title{font-size:16px;font-weight:600;color:var(--text-color);line-height:1.3}.desc{font-size:13px;color:var(--subtext-color);line-height:1.45}.preview-frame{border:1px solid var(--border-color);border-radius:10px;background:var(--preview-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:180px;max-height:240px;margin-block-start:2px}.preview-frame img{max-width:100%;max-height:240px;object-fit:contain;display:block}.brand{display:flex;align-items:center;gap:8px;margin-block-start:2px}.brand img{width:20px;height:20px}.brand span{font-size:13px;font-weight:500;color:var(--text-color)}.actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-block-start:6px}button{border:none;border-radius:20px;padding-block:9px;padding-inline:22px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:background 0.15s ease,opacity 0.15s ease;outline:none}.btn-cancel{background:transparent;color:var(--btn-secondary-color)}.btn-cancel:hover{background:var(--btn-secondary-hover)}.btn-allow{background:var(--primary-blue);color:var(--on-primary)}.btn-allow:hover{opacity:0.92}</style></head><body><div class="dialog-card" id="card"><div class="title" id="dc-title"></div><div class="desc" id="dc-desc"></div><div class="preview-frame"><img id="dc-preview" alt=""></div><div class="brand"><img src="../../assets/spark.svg" alt=""> <span id="dc-brand"></span></div><div class="actions"><button class="btn-allow" id="dc-allow"></button> <button class="btn-cancel" id="dc-cancel"></button></div></div></body></html>
