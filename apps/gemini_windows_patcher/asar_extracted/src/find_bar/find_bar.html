<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self';"
    />
    <link rel="stylesheet" href="../../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../../assets/overlay_tokens.css" />
    <style>
      :root {
        color-scheme: light dark;
        --find-bar-bg: var(--card-bg, #ffffff);
        --find-bar-border: var(--card-border, #e0e2e0);
        --find-bar-text: var(--text-primary, #1f1f1f);
        --find-bar-placeholder: var(--text-tertiary, #9aa0a6);
        --find-bar-count: var(--text-secondary, #5f6368);
        --find-bar-btn: var(--text-secondary, #5f6368);
        --find-bar-btn-hover: var(--btn-secondary-hover, rgba(0, 0, 0, 0.06));
        --find-bar-btn-active: var(--active-bg, rgba(0, 0, 0, 0.12));
        --find-bar-separator: var(--divider-color, #dadce0);
        --find-bar-disabled: var(--text-tertiary, #dadce0);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-family);
        background: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--overlay-gutter-md);
      }
      #bar {
        display: flex;
        align-items: center;
        width: 100%;
        height: 36px;
        background: var(--find-bar-bg);
        border: 1px solid var(--find-bar-border);
        border-radius: 8px;
        box-shadow: var(--shadow-elevation-2);
        overflow: hidden;
      }
      #input-area {
        display: flex;
        align-items: center;
        flex: 1;
        min-width: 0;
        padding: 0 12px;
        gap: 4px;
      }
      #input {
        flex: 1;
        min-width: 0;
        height: 28px;
        border: none;
        outline: none;
        font-size: 14px;
        font-family: inherit;
        color: var(--find-bar-text);
        background: transparent;
      }
      #input::placeholder {
        color: var(--find-bar-placeholder);
      }
      #count {
        font-size: 14px;
        color: var(--find-bar-count);
        white-space: nowrap;
        flex-shrink: 0;
      }
      #separator {
        width: 1px;
        height: 20px;
        background: var(--find-bar-separator);
        flex-shrink: 0;
      }
      #buttons {
        display: flex;
        align-items: center;
        padding: 0 4px;
        gap: 0;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: none;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        color: var(--find-bar-btn);
        padding: 0;
      }
      .btn:hover {
        background: var(--find-bar-btn-hover);
      }
      .btn:active {
        background: var(--find-bar-btn-active);
      }
      .btn:disabled {
        color: var(--find-bar-disabled);
        cursor: default;
        background: transparent;
      }
      .btn:focus-visible {
        outline: 2px solid var(--focus-ring, #0b57d0);
        outline-offset: 1px;
      }
      .btn svg {
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="input-area">
        <input
          id="input"
          type="text"
          spellcheck="false"
          autocomplete="off"
          aria-label="Find in page"
        />
        <span id="count"></span>
      </div>
      <div id="separator"></div>
      <div id="buttons">
        <button
          id="prev"
          class="btn"
          type="button"
          aria-label="Previous match"
          title="Previous match (Shift+Enter)"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="18 15 12 9 6 15" />
          </svg>
        </button>
        <button
          id="next"
          class="btn"
          type="button"
          aria-label="Next match"
          title="Next match (Enter)"
          disabled
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
        <button
          id="close"
          class="btn"
          type="button"
          aria-label="Close"
          title="Close (Escape)"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
