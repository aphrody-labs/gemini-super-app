<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Gemini</title>
    <style>
      :root {
        --md-sys-color-surface: light-dark(#ffffff, #131314);
        --md-sys-color-surface-container: light-dark(#f0f4f9, #1e1f20);
        --md-sys-color-surface-container-high: light-dark(#e3e8ef, #282a2c);
        --md-sys-color-on-surface: light-dark(#1f1f1f, #e3e3e3);
        --md-sys-color-primary: light-dark(#0b57d0, #a8c7fa);
        --md-sys-color-on-primary: light-dark(#ffffff, #042c6c);
        --md-sys-color-outline-variant: light-dark(#c4c7c5, #333537);
        color-scheme: light dark;
        accent-color: var(--md-sys-color-primary);
      }

      body {
        width: 260px;
        height: 280px;
        margin: 0;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 24px 16px;
        user-select: none;
        overflow: hidden;
      }

      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        flex: 1;
      }

      #toggle-live-btn {
        width: 96px;
        height: 96px;
        border: none;
        background: radial-gradient(
          circle,
          rgba(66, 133, 244, 0.22) 0%,
          rgba(155, 114, 203, 0.08) 65%,
          transparent 100%
        );
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      #pop-orb {
        transition: transform 120ms ease;
      }

      #popPetCanvas {
        width: 84px;
        height: 84px;
        cursor: pointer;
      }

      .dock {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        border-radius: 9999px;
        background: var(--md-sys-color-surface-container);
        border: 1px solid var(--md-sys-color-outline-variant);
      }

      .icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 9999px;
        border: none;
        background: transparent;
        color: var(--md-sys-color-on-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .icon-btn:hover {
        background: var(--md-sys-color-surface-container-high);
      }

      .icon-btn[aria-pressed="true"] {
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <button
        id="toggle-live-btn"
        type="button"
        aria-label="Activer ou désactiver Gemini Live Voice"
        aria-pressed="false"
      >
        <svg
          id="pop-orb"
          viewBox="0 0 64 64"
          width="54"
          height="54"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              id="popGrad"
              x1="4"
              y1="4"
              x2="60"
              y2="60"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0%" stop-color="#4285F4" />
              <stop offset="50%" stop-color="#9B72CB" />
              <stop offset="100%" stop-color="#D96570" />
            </linearGradient>
          </defs>
          <path
            d="M32 3C32 19.0163 19.0163 32 3 32C19.0163 32 32 44.9837 32 61C32 44.9837 44.9837 32 61 32C44.9837 32 32 19.0163 32 3Z"
            fill="url(#popGrad)"
          />
        </svg>
      </button>

      <canvas id="popPetCanvas" width="84" height="84"></canvas>
    </div>

    <nav class="dock" aria-label="Contrôles Gemini">
      <button
        id="mic-dock-btn"
        class="icon-btn"
        type="button"
        aria-label="Microphone Voice-to-Voice"
        aria-pressed="false"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
          <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
          <line x1="12" x2="12" y1="19" y2="22" />
        </svg>
      </button>

      <button
        id="pet-dim-btn"
        class="icon-btn"
        type="button"
        aria-label="Basculer 2D / 3D"
        aria-pressed="true"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"
          />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
      </button>

      <button
        id="open-sidepanel-btn"
        class="icon-btn"
        type="button"
        aria-label="Ouvrir le panneau latéral"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M15 3v18" />
        </svg>
      </button>
    </nav>

    <script src="popup.js" type="module"></script>
  </body>
</html>
