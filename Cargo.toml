[workspace]
members = [
    "crates/voice_dsp",
    "crates/mic_bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aphro <dev@google.com>"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
