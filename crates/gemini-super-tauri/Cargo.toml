[package]
name = "gemini-super-tauri"
description = "Unified Tauri v3 Alpha (3.0.0-alpha.5) native desktop & mobile shell crate for the One Big Gemini Super App & migrated Gemini Windows App"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "gemini_super_tauri"
path = "src/lib.rs"

[[bin]]
name = "gemini-windows-tauri-v3"
path = "src/main.rs"

[features]
default = []
tauri-v3-shell = [
    "dep:tauri",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-store",
]

[dependencies]
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Internal consolidated workspace crates
voice_dsp = { path = "../voice_dsp" }
mic_bridge = { path = "../mic_bridge" }
flowcat-core = { path = "../flowcat-core" }
polaris-audio = { path = "../polaris-audio" }
voicebox-audio = { path = "../voicebox-audio" }
lu-voice-engine = { path = "../lu-voice-engine" }
jan-agent-audio = { path = "../jan-agent-audio" }
awesome-rust-audio = { path = "../awesome-rust-audio" }

# Tauri v3 Alpha (November 2026 release line)
tauri = { workspace = true, optional = true }
tauri-plugin-shell = { workspace = true, optional = true }
tauri-plugin-dialog = { workspace = true, optional = true }
tauri-plugin-fs = { workspace = true, optional = true }
tauri-plugin-store = { workspace = true, optional = true }
