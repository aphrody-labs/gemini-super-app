[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "gemini-live-voice-super-app"
version = "2026.11.0"
description = "Unified November 2026 Gemini Live 3.8 Voice, Audio, Music & Google Super App (uv workspace consolidating Voicebox, Locally-Uncensored, Jan ADK, AudioCraft & Faster-Whisper)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.5",
  "av>=19.0.2",
  "edge-tts>=7.3.1",
  "faster-whisper>=1.2.1",
  "google-api-python-client>=2.201.0",
  "google-auth>=2.62.0",
  "google-genai>=2.34.0",
  "huggingface-hub>=2.4.0",
  "numpy>=2.5.4",
  "nvidia-cublas-cu12>=12.9.2.10",
  "nvidia-cudnn-cu12>=9.27.0.42",
  "onnxruntime>=1.31.1",
  "onnxruntime-directml>=1.24.4",
  "pydantic>=2.14.2",
  "sounddevice>=0.5.6",
  "tokenizers>=0.23.3",
  "websockets>=17.4",
]

[project.scripts]
gemini-voice-bridge = "backend.voice_bridge_server:main"
gemini-windows-patcher = "scripts.patch_and_pilot_gemini_windows:main"

[project.gui-scripts]
gemini-voice-bridge-w = "backend.voice_bridge_server:main"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.9.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend", "scripts"]

[tool.uv]
managed = true
package = true
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
