[project]
name = "gemini-live-voice-super-app"
version = "2026.11.0"
description = "Unified November 2026 Gemini Live 3.8 Voice, Audio, Music & Google Super App (uv workspace consolidating Voicebox, Locally-Uncensored, Jan ADK, AudioCraft & Faster-Whisper)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.5",
  "av>=19.0.2",
  "edge-tts>=7.3.1",
  "faster-whisper>=1.2.1",
  "google-api-python-client>=2.201.0",
  "google-auth>=2.62.0",
  "google-genai>=2.34.0",
  "huggingface-hub>=2.4.0",
  "numpy>=2.5.4",
  "onnxruntime>=1.31.1",
  "pydantic>=2.14.2",
  "sounddevice>=0.5.6",
  "tokenizers>=0.23.3",
  "websockets>=17.4",
]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.9.0"]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
