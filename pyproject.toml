[project]
name = "gemini-live-monorepo"
version = "0.1.0"
description = "Monorepo modernisé Gemini Live Voice Hub (Python FastAPI/Aiohttp, Faster-Whisper, Gemini Live 3.8, Edge-TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.0",
    "edge-tts>=7.0.0",
    "faster-whisper>=1.1.0",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "google-genai>=2.30.1",
    "numpy>=2.0.0",
    "sounddevice>=0.5.0",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
