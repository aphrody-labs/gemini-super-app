<!doctype html>
<html dir="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostic and Crash Reporting</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self';"
    />
    <link rel="stylesheet" href="../../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../../assets/overlay_tokens.css" />
    <style>
      :root {
        --card-radius: var(--shape-corner-lg, 16px);
        --btn-decline-hover: var(--btn-secondary-hover, rgba(0, 0, 0, 0.06));
        --btn-close-hover: var(--btn-secondary-hover, rgba(0, 0, 0, 0.06));
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: var(--font-family);
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toast-wrapper {
        width: 100%;
        height: 100%;
        padding: var(--overlay-gutter-xl);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toast-card {
        width: 100%;
        height: 100%;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--card-radius);
        box-shadow: var(--shadow-elevation-3);
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        animation: slideInUp 180ms cubic-bezier(0.1, 0.9, 0.2, 1);
      }
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .header-title-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-spark {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        line-height: 18px;
      }
      .btn-close {
        width: 24px;
        height: 24px;
        border: none;
        background: transparent;
        border-radius: 6px;
        color: var(--text-tertiary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 120ms ease,
          color 120ms ease;
      }
      .btn-close:hover {
        background: var(--btn-close-hover);
        color: var(--text-primary);
      }
      .btn-close:focus-visible {
        outline: 2px solid var(--focus-outline);
      }
      .icon-close {
        width: 14px;
        height: 14px;
      }
      .description {
        font-size: 12px;
        line-height: 16px;
        color: var(--text-secondary);
        margin: 4px 0;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 6px;
        border-top: 1px solid var(--card-border);
      }
      .subnote {
        font-size: 11px;
        color: var(--text-tertiary);
        white-space: nowrap;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-decline {
        height: 28px;
        padding: 0 12px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-family: var(--font-family);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 120ms ease,
          color 120ms ease;
      }
      .btn-decline:hover {
        background: var(--btn-decline-hover);
        color: var(--text-primary);
      }
      .btn-decline:focus-visible {
        outline: 2px solid var(--focus-outline);
      }
      .btn-allow {
        height: 28px;
        padding: 0 14px;
        border-radius: 6px;
        border: none;
        background: var(--primary-blue);
        color: var(--primary-on-blue);
        font-family: var(--font-family);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 120ms ease;
      }
      .btn-allow:hover {
        background: var(--primary-blue-hover);
      }
      .btn-allow:focus-visible {
        outline: 2px solid var(--focus-outline);
      }
    </style>
  </head>
  <body>
    <div class="toast-wrapper">
      <div
        class="toast-card"
        role="region"
        aria-labelledby="toast-title"
        aria-describedby="toast-desc"
      >
        <div class="header">
          <div class="header-title-group">
            <img
              class="icon-spark"
              src="../../assets/spark.svg"
              alt=""
              aria-hidden="true"
            />
            <h1 class="title" id="toast-title"></h1>
          </div>
          <button class="btn-close" id="btn-close" type="button" aria-label="">
            <svg
              class="icon-close"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <p class="description" id="toast-desc"></p>
        <div class="footer">
          <span class="subnote" id="toast-subnote"></span>
          <div class="actions">
            <button class="btn-decline" id="btn-decline" type="button"></button>
            <button class="btn-allow" id="btn-allow" type="button"></button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
