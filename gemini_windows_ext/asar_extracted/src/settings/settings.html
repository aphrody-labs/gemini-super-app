<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="../../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../../assets/overlay_tokens.css" />
    <style>
      @media (prefers-color-scheme: dark) {
        :root {
          --card-bg: var(--md-sys-color-surface-container, #1e1f20);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: var(--font-family);
        background: transparent;
        color: var(--text-primary);
      }
      .backdrop {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background: var(--bg-backdrop);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--overlay-gutter-xl);
        animation: fadeIn 0.16s cubic-bezier(0.05, 0.7, 0.1, 1);
      }
      .backdrop.preload {
        opacity: 0;
        animation: none;
      }
      .backdrop.preload .modal-card {
        animation: none;
      }
      .backdrop.preload * {
        transition: none !important;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--card-radius);
        width: clamp(340px, 68vw, 840px);
        height: clamp(380px, 70vh, 620px);
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 36px);
        box-shadow: var(--shadow-elevation-3);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: scaleUp 0.2s cubic-bezier(0.05, 0.7, 0.1, 1);
        transition:
          width 0.15s ease-out,
          height 0.15s ease-out;
      }
      @keyframes scaleUp {
        from {
          opacity: 0;
          transform: scale(0.96) translateY(6px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 24px 16px 24px;
        border-bottom: 1px solid var(--divider-color);
        flex-shrink: 0;
      }
      .modal-header h2 {
        font-size: clamp(16px, 1.4vw, 20px);
        font-weight: 500;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .close-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .close-btn:hover {
        background: var(--close-hover-bg);
        color: var(--text-primary);
      }
      .modal-body {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .sidebar {
        width: clamp(170px, 22vw, 230px);
        background: var(--sidebar-bg);
        border-inline-end: 1px solid var(--divider-color);
        padding: 16px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }
      .nav-item {
        width: 100%;
        text-align: start;
        padding: 10px 16px;
        border-radius: 100px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: clamp(12px, 1vw, 14px);
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav-item:hover {
        background: rgba(128, 128, 128, 0.08);
        color: var(--text-primary);
      }
      .nav-item.active {
        background: var(--pill-active-bg);
        color: var(--pill-active-text);
        font-weight: 600;
      }
      .nav-item svg {
        width: 20px;
        height: 20px;
        fill: currentColor;
        flex-shrink: 0;
      }
      .tab-content {
        flex: 1;
        padding: clamp(18px, 2.5vw, 28px);
        overflow-y: auto;
        display: none;
      }
      .tab-content.active {
        display: flex;
        flex-direction: column;
      }
      .tab-title {
        font-size: clamp(15px, 1.3vw, 18px);
        font-weight: 500;
        color: var(--text-primary);
        margin-bottom: 4px;
      }
      .tab-desc {
        font-size: clamp(12px, 0.95vw, 13px);
        color: var(--text-tertiary);
        margin-bottom: 20px;
        line-height: 1.4;
      }
      .settings-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
      }
      .setting-item {
        background: var(--setting-card-bg);
        border: 1px solid var(--setting-card-border);
        border-radius: 18px;
        padding: clamp(14px, 1.6vw, 20px) clamp(16px, 1.8vw, 22px);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        transition: border-color 0.15s;
      }
      .setting-item-left {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        flex: 1;
      }
      .setting-icon {
        width: 20px;
        height: 20px;
        fill: var(--text-secondary);
        flex-shrink: 0;
        margin-top: 1px;
      }
      .setting-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;
      }
      .setting-label {
        font-size: clamp(13px, 1vw, 14px);
        font-weight: 500;
        color: var(--text-primary);
      }
      .setting-sublabel {
        font-size: clamp(11px, 0.9vw, 12px);
        color: var(--text-secondary);
        line-height: 1.35;
      }
      .inline-warning {
        margin-top: 6px;
        font-size: clamp(11px, 0.88vw, 12px);
        color: var(--warning-color);
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .inline-warning span::before {
        content: "⚠️ ";
      }
      .inline-warning-link {
        background: none;
        border: none;
        color: var(--primary-blue);
        font-size: clamp(11px, 0.88vw, 12px);
        font-weight: 500;
        cursor: pointer;
        text-decoration: underline;
        font-family: inherit;
        padding: 0;
        text-align: start;
        width: fit-content;
      }
      .inline-warning-link:hover {
        opacity: 0.85;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 26px;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: var(--switch-track-off);
        transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
        border-radius: 26px;
        border: 1px solid rgba(128, 128, 128, 0.15);
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        inset-inline-start: 3px;
        bottom: 3px;
        background-color: var(--switch-thumb-off);
        transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: var(--switch-track-on);
        border-color: transparent;
      }
      input:checked + .slider:before {
        transform: translateX(22px);
        background-color: var(--switch-thumb-on);
      }
      [dir="rtl"] input:checked + .slider:before {
        transform: translateX(-22px);
      }
      .select-container {
        position: relative;
        display: flex;
        align-items: center;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .setting-select {
        appearance: none;
        -webkit-appearance: none;
        background-color: var(--card-bg);
        color: var(--text-primary);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding-block: 8px;
        padding-inline: 14px 36px;
        font-size: clamp(12px, 0.95vw, 13px);
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        min-width: 240px;
        box-sizing: border-box;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
        background-image: url('data:image/svg+xml;utf8,<svg fill="%23747775" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 18px;
      }
      [dir="rtl"] .setting-select {
        background-position: left 10px center;
      }
      @media (prefers-color-scheme: dark) {
        .setting-select {
          background-image: url('data:image/svg+xml;utf8,<svg fill="%23c4c7c5" height="20" viewBox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
        }
      }
      .setting-select:hover {
        border-color: var(--primary-blue);
      }
      .setting-select:focus {
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.25);
      }
      .shortcut-recorder-box {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: var(--card-bg);
        color: var(--text-primary);
        border: 1px solid var(--primary-blue);
        box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.25);
        border-radius: 10px;
        padding: 8px 16px;
        font-size: clamp(12px, 0.95vw, 13px);
        font-family: inherit;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        min-width: 240px;
        box-sizing: border-box;
        text-align: center;
        user-select: none;
        animation: pulseRecording 1.5s infinite ease-in-out;
      }
      @keyframes pulseRecording {
        0% {
          box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.25);
        }
        50% {
          box-shadow: 0 0 0 4px rgba(11, 87, 208, 0.4);
        }
        100% {
          box-shadow: 0 0 0 2px rgba(11, 87, 208, 0.25);
        }
      }
      .recorder-placeholder {
        color: var(--text-secondary);
      }
      .recorder-active-keys {
        color: var(--primary-blue);
        font-weight: 600;
      }
      .modal-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 18px;
        border-top: 1px solid var(--divider-color);
        flex-shrink: 0;
      }
      .btn-text-danger {
        background: transparent;
        border: none;
        color: var(--btn-danger-color);
        font-size: clamp(12px, 0.9vw, 13px);
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        padding: 8px 12px;
        border-radius: 8px;
        transition: background 0.15s;
      }
      .btn-text-danger:hover {
        background: var(--btn-danger-hover);
      }
      .settings-section-header {
        font-size: clamp(11px, 0.85vw, 12px);
        font-weight: 600;
        color: var(--primary-blue);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        margin-top: 14px;
        margin-bottom: 8px;
        padding-inline-start: 2px;
      }
      .btn-action {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        background: transparent;
        transition: all 0.15s ease-in-out;
        user-select: none;
      }
      .btn-action.btn-danger {
        color: var(--btn-danger-color);
        border: 1px solid var(--btn-danger-color);
      }
      .btn-action.btn-danger:hover {
        background: var(--btn-danger-hover);
      }
      .btn-action.btn-warning {
        color: var(--warning-color);
        border: 1px solid var(--warning-color);
      }
      .btn-action.btn-warning:hover {
        background: var(--btn-warning-hover);
      }
      .btn-action.btn-primary {
        color: var(--primary-blue);
        border: 1px solid var(--primary-blue);
      }
      .btn-action.btn-primary:hover {
        background: var(--btn-primary-hover-bg);
      }
      .btn-action:active {
        transform: scale(0.96);
      }
      .btn-action:disabled,
      .btn-action:disabled:hover {
        color: var(--text-primary);
        border-color: var(--text-primary);
        background: transparent;
        cursor: default;
        transform: none;
        opacity: var(--md-sys-state-disabled-state-layer-opacity);
      }
      .setting-icon-danger {
        fill: var(--btn-danger-color);
      }
      .setting-icon-warning {
        fill: var(--warning-color);
      }
      .setting-icon-primary {
        fill: var(--primary-blue);
      }
      .btn-done {
        background: var(--primary-blue);
        color: var(--primary-on-blue);
        border: none;
        border-radius: 100px;
        padding: 8px 26px;
        font-size: clamp(13px, 0.95vw, 14px);
        font-weight: 500;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-done:hover {
        background: var(--primary-blue-hover);
      }
      .about-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--divider-color);
        font-size: clamp(13px, 0.95vw, 14px);
      }
      .about-k {
        color: var(--text-tertiary);
      }
      .about-v {
        color: var(--text-primary);
        font-weight: 500;
      }
      .modal-top-update-banner {
        background: linear-gradient(
          90deg,
          rgba(66, 133, 244, 0.12) 0%,
          rgba(155, 114, 203, 0.12) 50%,
          rgba(217, 101, 112, 0.12) 100%
        );
        border-bottom: 1px solid rgba(168, 199, 250, 0.25);
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-shrink: 0;
      }
      .update-banner-info {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .update-title-line {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .update-sub-line {
        font-size: 12px;
        color: var(--text-secondary);
      }
      .btn-modal-restart {
        background: var(--primary-blue);
        color: var(--primary-on-blue);
        border: none;
        border-radius: 100px;
        padding: 7px 16px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-modal-restart:hover {
        background: var(--primary-blue-hover);
      }
      @media (max-width: 800px) {
        .backdrop {
          padding: 16px;
        }
        .modal-card {
          width: calc(100vw - 32px);
        }
      }
      @media (max-width: 560px) {
        .modal-card {
          height: min(520px, calc(100vh - 24px));
        }
        .modal-body {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          border-inline-end: none;
          border-bottom: 1px solid var(--divider-color);
          flex-direction: row;
          padding: 8px 12px;
        }
        .nav-item {
          padding: 6px 12px;
          font-size: 12px;
        }
        .tab-content {
          padding: 14px 16px;
        }
      }
      @media (max-width: 440px) {
        .setting-item {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }
        .setting-select,
        .shortcut-recorder-box {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop preload" id="backdrop">
      <div class="modal-card" id="modal-card">
        <div class="modal-header">
          <h2>
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="currentColor"
              style="color: var(--primary-blue)"
            >
              <path
                d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
              /></svg
            ><span id="settings-heading"></span>
          </h2>
          <button class="close-btn" id="btn-close-modal" title="Close">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </div>
        <div
          class="modal-top-update-banner"
          id="modal-top-update-banner"
          style="display: none"
        >
          <div class="update-banner-info">
            <img
              src="../../assets/spark.svg"
              width="22"
              height="22"
              alt=""
              aria-hidden="true"
              style="flex-shrink: 0"
            />
            <div>
              <div class="update-title-line" id="staged-update-title"></div>
              <div class="update-sub-line" id="staged-update-subtext"></div>
            </div>
          </div>
          <button class="btn-modal-restart" id="btn-modal-restart"></button>
        </div>
        <div class="modal-body">
          <div class="sidebar">
            <button class="nav-item active" id="btn-tab-general">
              <svg viewBox="0 0 24 24">
                <path
                  d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"
                /></svg
              ><span id="label-tab-general"></span>
            </button>
            <button class="nav-item" id="btn-tab-privacy">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"
                /></svg
              ><span id="label-tab-privacy"></span>
            </button>
            <button class="nav-item" id="btn-tab-about">
              <svg viewBox="0 0 24 24">
                <path
                  d="M11 17h2v-6h-2v6zm1-8c.55 0 1-.45 1-1s-.45-1-1-1-1 .45-1 1 .45 1 1 1zm0-7C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"
                /></svg
              ><span id="label-tab-about"></span>
            </button>
          </div>
          <div class="tab-content active" id="pane-general">
            <div class="tab-title" id="title-pane-general"></div>
            <div class="tab-desc" id="desc-pane-general"></div>
            <div class="settings-list">
              <div class="setting-item">
                <div class="setting-text">
                  <div class="setting-label" id="label-shortcut"></div>
                  <div class="setting-sublabel" id="desc-shortcut"></div>
                  <div
                    class="inline-warning"
                    id="shortcut-conflict-warning"
                    style="display: none"
                  >
                    <span id="text-shortcut-conflict"></span>
                  </div>
                </div>
                <div class="select-container" id="shortcut-select-container">
                  <select class="setting-select" id="select-shortcut">
                    <option value="Alt+Space" id="opt-shortcut-alt-space">
                      Alt + Space
                    </option>
                    <option
                      value="Alt+Shift+Space"
                      id="opt-shortcut-alt-shift-space"
                    >
                      Alt + Shift + Space
                    </option>
                    <option
                      value="Win+Alt+Space"
                      id="opt-shortcut-win-alt-space"
                    >
                      Win + Alt + Space
                    </option>
                    <option value="Win+Shift+G" id="opt-shortcut-win-shift-g">
                      Win + Shift + G
                    </option>
                    <option value="None" id="opt-shortcut-none"></option>
                    <option value="Custom" id="opt-shortcut-custom"></option>
                    <option
                      value="__custom_active__"
                      id="opt-shortcut-custom-active"
                      hidden
                    ></option>
                  </select>
                  <div
                    class="shortcut-recorder-box"
                    id="shortcut-recorder-box"
                    tabindex="0"
                    style="display: none"

                    <span
                      class="recorder-placeholder"
                      id="recorder-display-text"
                      aria-live="polite"
                    ></span>
                  </div>
                </div>
              </div>
              <div

                id="stc-shortcut-setting-item"
                style="display: none"

                <div class="setting-text">
                  <div class="setting-label" id="label-stc-shortcut"></div>
                  <div class="setting-sublabel" id="desc-stc-shortcut"></div>
                  <div
                    class="inline-warning"
                    id="stc-shortcut-conflict-warning"
                    style="display: none"

                    <span id="text-stc-shortcut-conflict"></span>
                  </div>
                </div>
                <div
                  class="select-container"
                  id="stc-shortcut-select-container"
                >
                  <select class="setting-select" id="select-stc-shortcut">
                    <option
                      value="Alt+Shift+D"
                      id="opt-stc-shortcut-alt-shift-d"
                    >
                      Alt + Shift + D
                    </option>
                    <option
                      value="Ctrl+Shift+D"
                      id="opt-stc-shortcut-ctrl-shift-d"
                    >
                      Ctrl + Shift + D
                    </option>
                    <option value="None" id="opt-stc-shortcut-none"></option>
                    <option
                      value="Custom"
                      id="opt-stc-shortcut-custom"
                    ></option>
                    <option
                      value="__custom_active__"
                      id="opt-stc-shortcut-custom-active"
                      hidden
                    ></option>
                  </select>
                  <div
                    class="shortcut-recorder-box"
                    id="stc-shortcut-recorder-box"
                    tabindex="0"
                    style="display: none"
                  >
                    <span
                      class="recorder-placeholder"
                      id="stc-recorder-display-text"
                      aria-live="polite"
                    ></span>
                  </div>
                </div>
              </div>
              <div class="setting-item">
                <div class="setting-text">
                  <div class="setting-label" id="label-open-at-login"></div>
                  <div class="setting-sublabel" id="desc-open-at-login"></div>
                  <div
                    class="inline-warning"
                    id="startup-windows-warning"
                    style="display: none"
                  >
                    <span id="text-startup-warning"></span>
                    <button
                      class="inline-warning-link"
                      id="btn-open-windows-startup"
                    ></button>
                  </div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="toggle-open-at-login" />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-text">
                  <div
                    class="setting-label"
                    id="label-disable-shortcut-in-fullscreen"
                  ></div>
                  <div
                    class="setting-sublabel"
                    id="desc-disable-shortcut-in-fullscreen"
                  ></div>
                </div>
                <label class="switch">
                  <input
                    type="checkbox"
                    id="toggle-disable-shortcut-in-fullscreen"
                  />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="modal-footer" style="justify-content: flex-end">
              <button class="btn-done"></button>
            </div>
          </div>

            <div class="tab-desc" id="desc-pane-privacy"></div>

                      style="display: none"

                      <span id="text-mic-warning"></span>
                      <button
                        class="inline-warning-link"
                        id="btn-open-windows-privacy"
                      ></button>
                    </div>
                  </div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="toggle-media" />
                  <span class="slider"></span>

                  <svg

                  <div class="setting-text">
                    <div class="setting-label" id="label-camera"></div>
                    <div class="setting-sublabel" id="desc-camera"></div>

                      id="camera-windows-warning"
                      style="display: none"
                    >
                      <span id="text-camera-warning"></span>
                      <button
                        class="inline-warning-link"
                        id="btn-open-windows-camera-privacy"
                      ></button>
                    </div>
                  </div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="toggle-camera" />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-item-left">
                  <svg
                    class="setting-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"

                      d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                    />

                  <div class="setting-text">
                    <div class="setting-label" id="label-location"></div>
                    <div class="setting-sublabel" id="desc-location"></div>
                    <div

                      id="location-windows-warning"

                    >
                      <span id="text-location-warning"></span>
                      <button

                        id="btn-open-windows-location-privacy"
                      ></button>
                    </div>
                  </div>
                </div>
                <label class="switch">
                  <input type="checkbox" id="toggle-geolocation" />
                  <span class="slider"></span>
                </label>
              </div>
              <div class="setting-item">
                <div class="setting-item-left">
                  <svg
                    class="setting-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"

                    />
                  </svg>
                  <div class="setting-text">
                    <div
                      class="setting-label"
                      id="label-diagnostic-consent"
                    ></div>
                    <div
                      class="setting-sublabel"
                      id="desc-diagnostic-consent"
                    ></div>
                  </div>
                </div>
                <label class="switch">
                  <input
                    type="checkbox"
                    id="toggle-diagnostic-consent"
                    aria-labelledby="label-diagnostic-consent"
                    aria-describedby="desc-diagnostic-consent"
                  />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div class="modal-footer">
              <button
                class="btn-text-danger"
                id="btn-reset-permissions"
              ></button>
              <button class="btn-done"></button>
            </div>
          </div>
          <div class="tab-content" id="pane-about">
            <div
              style="
                display: flex;
                align-items: center;
                gap: 14px;
                margin-bottom: 8px;
              "

                src="../../assets/icon.png"

                height="36"
                alt="Gemini"
                style="flex-shrink: 0; border-radius: 8px"
              />

                <div
                  class="tab-title"

                  <span class="about-v" id="val-version"></span>

            <div class="modal-footer" style="justify-content: flex-end">
              <button class="btn-done"></button>
