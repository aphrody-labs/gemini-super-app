<!doctype html>
<html dir="auto">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;"
    />
    <link rel="stylesheet" href="../../assets/fonts/fonts.css" />
    <link rel="stylesheet" href="../../assets/overlay_tokens.css" />
    <style>
      :root {
        --bg: var(--surface-bg, #ffffff);
        --border-bottom: var(--card-border, #e0e2e0);
        --window-controls-width: 138px;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        user-select: none;
        font-family: var(--font-family);
      }
      .top-bar-container {
        position: fixed;
        top: 0;
        inset-inline-start: 0;
        inset-inline-end: var(--window-controls-width);
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        padding-inline-start: 12px;
        padding-inline-end: 4px;
        -webkit-app-region: drag;
      }
      .app-title-area {
        display: flex;
        align-items: center;
        gap: 8px;
        -webkit-app-region: drag;
      }
      .app-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-secondary);
        letter-spacing: 0.2px;
        line-height: 1;
      }
      .gemini-orb-wrap {
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        animation: gemSpin 6s linear infinite;
      }
      @keyframes gemSpin {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.16);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }
      .actions-area {
        display: flex;
        align-items: center;
        gap: 6px;
        -webkit-app-region: drag;
      }
      .voice-pill-btn {
        -webkit-app-region: no-drag;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        border: 1px solid rgba(66, 133, 244, 0.38);
        background: rgba(66, 133, 244, 0.12);
        color: var(--text-primary, #1f1f1f);
        font-family: var(--font-family);
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
        transition: all 150ms ease;
      }
      .voice-pill-btn:hover {
        background: rgba(66, 133, 244, 0.24);
      }
      .voice-pill-btn.active {
        background: linear-gradient(135deg, #4285f4, #9b72cb, #d96570);
        color: #ffffff;
        border-color: transparent;
      }
      .voice-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #4285f4;
      }
      .voice-pill-btn.active .voice-dot {
        background: #81c995;
        box-shadow: 0 0 6px #81c995;
      }
      .menu-btn {
        -webkit-app-region: no-drag;
        width: 28px;
        height: 28px;
        padding: 0;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        outline: none;
        border-radius: 50%;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        transition:
          background-color 150ms ease,
          color 150ms ease;
      }
      .menu-btn:focus {
        outline: none;
      }
      .menu-btn:hover:not(.no-hover) {
        background: var(--hover-bg);
        color: var(--text-primary);
      }
      .menu-btn:active:not(.no-hover) {
        background: var(--active-bg);
      }
      .menu-btn:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 1px;
      }
      .menu-btn svg {
        display: block;
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar-container">
      <div class="app-title-area">
        <span class="gemini-orb-wrap" id="topbar-gemini-orb"
          ><svg
            viewBox="0 0 64 64"
            width="18"
            height="18"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient
                id="tbGemGrad"
                x1="4"
                y1="4"
                x2="60"
                y2="60"
                gradientUnits="userSpaceOnUse"
              >
                <stop offset="0%" stop-color="#4285F4" />
                <stop offset="38%" stop-color="#9B72CB" />
                <stop offset="72%" stop-color="#D96570" />
                <stop offset="100%" stop-color="#F49C46" />
              </linearGradient>
            </defs>
            <path
              d="M32 3C32 19.0163 19.0163 32 3 32C19.0163 32 32 44.9837 32 61C32 44.9837 44.9837 32 61 32C44.9837 32 32 19.0163 32 3Z"
              fill="url(#tbGemGrad)"
            /></svg></span
        ><span class="app-title" id="app-title">Gemini Live</span>
      </div>
      <div class="actions-area">
        <button
          id="btn-voice-live"
          class="voice-pill-btn"
          type="button"
          title="Activer/Désactiver le mode /voice Live Full-Duplex"
        >
          <span class="voice-dot"></span
          ><span id="btn-voice-live-label">/voice Live</span></button
        ><button
          id="btn-voice-stc"
          class="voice-pill-btn"
          type="button"
          title="Ouvrir la capsule vocale Speak-to-Window / Record (Alt+Shift+D)"
        >
          ● Record (STC)</button
        ><button
          id="btn-voice-hub"
          class="voice-pill-btn"
          type="button"
          title="Ouvrir le studio Flutter Gemini Voice Hub"
        >
          Hub</button
        ><button
          id="btn-menu"
          class="menu-btn"
          type="button"
          aria-label="Main menu"
          title="Main menu"
        >
          <svg viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
            <path
              d="M200-560q-17,0-28.5-11.5T160-600t11.5-28.5T200-640H760q17,0 28.5,11.5T800-600t-11.5,28.5T760-560H200Zm0,240q-17,0-28.5-11.5T160-360t11.5-28.5T200-400H760q17,0 28.5,11.5T800-360t-11.5,28.5T760-320H200Z"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
