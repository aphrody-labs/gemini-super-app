<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Update Available</title><link rel="stylesheet" href="../../assets/fonts/fonts.css"/><link rel="stylesheet" href="../../assets/overlay_tokens.css"/><style>:root{--btn-dismiss:var(--text-tertiary,#747775);--btn-dismiss-hover:var(--btn-secondary-hover,rgba(0,0,0,0.08))}*{box-sizing:border-box;margin:0;padding:0;user-select:none}html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:var(--font-family)}body{display:flex;align-items:center;justify-content:flex-end;padding-inline:var(--overlay-gutter-md)}[dir='rtl'] body{justify-content:flex-start}.pill-card{background:var(--bg-card);border:1px solid var(--border-card);border-radius:100px;padding-block:6px;padding-inline:14px 12px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-elevation-2);animation:slideIn 0.25s cubic-bezier(0.05,0.7,0.1,1);max-width:100%;flex-shrink:0}@keyframes slideIn{from{opacity:0;transform:translateY(12px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}.sparkle-icon{width:20px;height:20px;flex-shrink:0}.pill-text{font-size:13px;font-weight:500;color:var(--text-primary);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}.btn-restart{background:var(--primary-blue);color:var(--primary-on-blue);border:none;border-radius:100px;padding:6px 14px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background 0.15s,transform 0.1s}.btn-restart:hover{background:var(--primary-blue-hover)}.btn-dismiss{background:transparent;border:none;color:var(--btn-dismiss);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;flex-shrink:0;transition:background 0.15s,color 0.15s}.btn-dismiss:hover{background:var(--btn-dismiss-hover);color:var(--text-primary)}</style></head><body><div class="pill-card" id="pill-card"><img class="sparkle-icon" src="../../assets/spark.svg" alt="" aria-hidden="true"/><div class="pill-text" id="pill-text"></div><button class="btn-restart" id="btn-restart"></button> <button class="btn-dismiss" id="btn-dismiss" title="Dismiss">✕</button></div></body></html>
